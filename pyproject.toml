[project]
name = "giswater-api"
version = "1.6.2"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn==0.42.0",
    "gunicorn==25.1.0",
    "pydantic==2.12.5",
    "pydantic-geojson==0.3.2",
    "httpx==0.28.1",
    "psycopg[binary,pool]==3.3.3",
    "alembic==1.16.5",
    "requests==2.33.0",
    "pyproj==3.7.2",
    "pyjwt[crypto]==2.13.0",
    "cryptography==50.0.0",
    "bcrypt==4.3.0",
    "fastapi-keycloak==1.1.1",
    "python-dotenv==1.2.2",
    "python-multipart>=0.0.9",
    "click==8.2.1",
]

[project.scripts]
giswater-api = "app.cli.main:main"

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
exclude = [
    "__pycache__",
    ".git",
    ".venv",
    ".pytest_cache",
    ".idea",
]
line-length = 120

[tool.ruff.lint]
select = ["E2", "E3", "E4", "E7", "E9", "N8", "C90", "F", "B", "Q"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses these in function defaults for dependency injection.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
    "Depends",
    "Query",
    "Path",
    "Body",
    "Header",
    "Form",
    "File",
]

[tool.ruff.lint.per-file-ignores]
# Pydantic models use camelCase for JSON serialization.
"app/schemas/*.py" = ["N815"]
"app/schemas/**/*.py" = ["N815"]
